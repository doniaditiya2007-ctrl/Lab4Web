<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab4Web - Kontak</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-form { max-width: 600px; }
        .contact-form label { display: block; margin: 12px 0 5px; font-weight: 600; }
        .contact-form input, .contact-form textarea {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px;
            font: inherit;
        }
        .contact-form button {
            margin-top: 14px; padding: 10px 18px; border: 0; border-radius: 4px;
            color: white; background: #2563eb; cursor: pointer; font: inherit;
        }
        .contact-form button:hover { background: #1e40af; }
    </style>
</head>
<body>
    <div id="container">
        <header>
            <h1>Lab4Web</h1>
            <p>Belajar membuat layout website dengan CSS</p>
        </header>
        <nav>
            <a href="home.html">Home</a>
            <a href="artikel.html">Artikel</a>
            <a href="about.html">About</a>
            <a class="active" href="kontak.html">Kontak</a>
        </nav>
        <section id="hero">
            <h1>Kontak</h1>
            <p>Contoh form sederhana menggunakan HTML.</p>
        </section>
        <section id="wrapper">
            <section id="main" style="width:100%;">
                <h2>Hubungi Kami</h2>
                <p>Isi form berikut untuk contoh latihan. Form ini belum terhubung ke server.</p>
                <form class="contact-form" action="#" method="post">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="nama@email.com" required>

                    <label for="pesan">Pesan</label>
                    <textarea id="pesan" name="pesan" rows="5" placeholder="Tulis pesan..." required></textarea>

                    <button type="submit">Kirim</button>
                </form>
            </section>
        </section>
        <footer><p>&copy; 2026 Lab4Web | Praktikum Pemrograman Web</p></footer>
    </div>
</body>
</html>
